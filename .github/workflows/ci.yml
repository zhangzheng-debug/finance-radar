name: finance-radar-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed text for whitespace errors
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]] \
            && [[ ! "${BASE_SHA}" =~ ^0+$ ]] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BASE_SHA}" "${HEAD_SHA}"
          else
            git show --check --format= "${HEAD_SHA}"
          fi
      - name: Validate systemd shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "bash -n ${script}"
            bash -n "${script}"
          done < <(find deployment/systemd -type f -name '*.sh' -print0)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Guard high-confidence secrets and trading write routes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import hashlib
          from pathlib import Path
          import re
          import subprocess
          import sys

          patterns = (
              ("private-key", re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----")),
              ("aws-access-key", re.compile(rb"\b(?:AKIA|ASIA)[0-9A-Z]{16}\b")),
              ("github-token", re.compile(rb"\b(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{50,})\b")),
              ("openai-key", re.compile(rb"\bsk-(?:proj-)?[A-Za-z0-9_-]{24,}\b")),
              ("google-api-key", re.compile(rb"\bAIza[0-9A-Za-z_-]{35}\b")),
              ("slack-token", re.compile(rb"\bxox[baprs]-[A-Za-z0-9-]{20,}\b")),
              ("stripe-live-key", re.compile(rb"\b(?:sk|rk)_live_[A-Za-z0-9]{20,}\b")),
              ("telegram-bot-token", re.compile(rb"\b[0-9]{8,12}:[A-Za-z0-9_-]{30,}\b")),
              ("basic-auth-url", re.compile(rb"https?://[^\s/@:]+:[^\s/@]+@")),
              (
                  "named-secret-assignment",
                  re.compile(
                      rb"(?m)^[ \t]*['\"]?(?:export[ \t]+)?(?:TELEGRAM_BOT_TOKEN|TELEGRAM_API_HASH|API_SECRET|API_HASH|"
                      rb"AWS_SECRET_ACCESS_KEY|CLOUDFLARE_API_TOKEN|OPENAI_API_KEY|GITHUB_TOKEN|"
                      rb"TWELVE_DATA_API_KEY|MARKETAUX_API_TOKEN|APCA_API_KEY_ID|"
                      rb"APCA_API_SECRET_KEY|FINANCE_RADAR_ADMIN_TOKEN)[ \t]*=[ \t]*['\"]?([^\s'\"#]+)"
                  ),
              ),
          )
          known_test_fixtures = {
              (
                  "tests/test_build_defense_evidence_pack.py",
                  "telegram-bot-token",
                  "b75e2953d3ee3fd461157c9644c9d14400ddd3b481e7278142df8e2ed6aba728",
              ),
              (
                  "tests/test_local_evidence_model.py",
                  "basic-auth-url",
                  "f8c7f2987069485166a19282090fd6bfda8b12c5ccf46c99846068ed92369f32",
              ),
          }
          placeholder_prefixes = (
              b"${",
              b"$",
              b"<",
              b"change-",
              b"changeme",
              b"dummy",
              b"example",
              b"offline-demo-",
              b"replace-",
              b"test",
              b"your-",
              b"your_",
          )
          tracked = subprocess.check_output(("git", "ls-files", "-z")).split(b"\0")
          violations: list[str] = []
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = Path(raw_path.decode("utf-8", errors="surrogateescape"))
              try:
                  data = path.read_bytes()
              except OSError as exc:
                  violations.append(f"unreadable tracked file: {path}: {exc}")
                  continue
              if b"\0" in data[:8192]:
                  continue
              normalized = path.as_posix()
              for detector, pattern in patterns:
                  for match in pattern.finditer(data):
                      if detector == "named-secret-assignment":
                          value = match.group(1).lower()
                          if not value or value.startswith(placeholder_prefixes):
                              continue
                      digest = hashlib.sha256(match.group(0)).hexdigest()
                      if (normalized, detector, digest) in known_test_fixtures:
                          continue
                      line = data.count(b"\n", 0, match.start()) + 1
                      violations.append(f"{normalized}:{line}: {detector}")

          write_methods = {"post", "put", "patch", "delete"}
          prohibited_route_terms = ("order", "position", "balance", "trade", "brokerage")
          for path in Path("app").rglob("*.py"):
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except (OSError, SyntaxError, UnicodeError) as exc:
                  violations.append(f"unable to audit routes in {path.as_posix()}: {exc}")
                  continue
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  for decorator in node.decorator_list:
                      if not isinstance(decorator, ast.Call) or not decorator.args:
                          continue
                      function = decorator.func
                      route = decorator.args[0]
                      if not isinstance(function, ast.Attribute) or function.attr.lower() not in write_methods:
                          continue
                      if not isinstance(route, ast.Constant) or not isinstance(route.value, str):
                          continue
                      lowered = route.value.lower()
                      if any(term in lowered for term in prohibited_route_terms):
                          violations.append(
                              f"{path.as_posix()}:{getattr(node, 'lineno', 1)}: prohibited trading write route {route.value!r}"
                          )

          if violations:
              print("repository safety gate failed:", file=sys.stderr)
              for violation in violations:
                  print(f"- {violation}", file=sys.stderr)
              raise SystemExit(1)
          print("repository safety gate passed")
          PY
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app scripts tests
      - run: pytest -q --cov=app --cov=scripts --cov-report=term-missing --cov-report=xml
