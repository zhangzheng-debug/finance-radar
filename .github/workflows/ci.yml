name: finance-radar-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app scripts tests
      - run: pytest -q --cov=app --cov=scripts --cov-report=term-missing --cov-report=xml
      - name: Guard repository secrets and trading routes
        shell: bash
        run: |
          ! grep -RInE '(TELEGRAM_BOT_TOKEN|API_SECRET|API_HASH)=[^[:space:]]+' --exclude='.env.example' --exclude-dir='.git' .
          ! grep -RInE '@(app|application)\.(post|put|patch|delete)\("/[^"]*(orders|positions|balances|trade)' app
