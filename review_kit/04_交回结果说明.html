<h1>完成后只交回一个文件</h1>
<div class="box">
  <ol>
    <li>确认页面顶部进度为全部完成。</li>
    <li>点击“导出最终结果”。</li>
    <li>浏览器会下载一个以 <code>.review.json</code> 结尾的文件。</li>
    <li>把这个文件通过微信、网盘私密分享或负责人指定的私有渠道交回。</li>
  </ol>
</div>
<p>不要改文件名以外的内容，不要用记事本打开后保存，不要打包数据库、截图、浏览器记录或账号密码。</p>
<p>在两个人都交回之前，不要把答案上传到公开 GitHub；否则另一名审核人可能看到答案，独立性失效。</p>
