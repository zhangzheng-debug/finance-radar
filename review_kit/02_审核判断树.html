<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>审核判断树</title>
<style>body{max-width:980px;margin:40px auto;padding:0 22px;background:#07111b;color:#edf6ff;font:18px/1.7 system-ui,"Microsoft YaHei"}h1{color:#58dfff}.step{padding:16px;margin:12px 0;border:1px solid #36516b;border-radius:12px;background:#0d1b2a}.yes{color:#70e9b2}.no{color:#ff9aaa}.wait{color:#ffd08a}</style>
<h1>事件事实审核判断树</h1>
<div class="step">① 原始来源打不开，或只有标题/搜索摘要？<br><strong class="wait">→ 证据不足</strong></div>
<div class="step">② 原文说的不是屏幕中的公司/证券？<br><strong class="no">→ 排除当前说法：主体错误</strong></div>
<div class="step">③ 原文没有明确说这个事件，或只是提到关键词？<br><strong class="no">→ 排除当前说法或证据不足</strong></div>
<div class="step">④ 系统说“已经发生”，原文却是计划、申请、可能、待批准或附条件？<br><strong class="no">→ 排除当前事件节点：阶段错误</strong></div>
<div class="step">⑤ 日期不一致，出现撤回、否定、冲突、疑似重复或法律含义看不懂？<br><strong class="wait">→ 升级复杂复核</strong></div>
<div class="step">⑥ 主体、事件、阶段、日期、一手原文全部精确匹配，并且没有冲突？<br><strong class="yes">→ 确认事实成立</strong></div>
<p>本批次不要求你判断严重度。事实是否成立与严重程度是两个问题，避免新人把“看起来很严重”误当成事实证据。</p>
