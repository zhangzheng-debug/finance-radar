server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name radar.18-208-34-152.sslip.io;

    ssl_certificate /etc/letsencrypt/live/radar.18-208-34-152.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radar.18-208-34-152.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FinanceRadarTLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        return 302 /radar/;
    }

    location = /radar {
        return 301 /radar/;
    }

    # Evidence Terminal v2 is a single-file hash-routed application.
    location = /radar/ {
        rewrite ^ /radar/index.html last;
    }

    location = /radar/index.html {
        alias /var/www/finance-radar-terminal/index.html;
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-cache" always;
    }

    # Public proof of the latest encrypted, off-host, fully restored backup.
    location = /radar/offhost-status.json {
        alias /var/www/finance-radar-terminal/offhost-status.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # Redirect legacy Streamlit deep links to the new hash-routed terminal.
    location ^~ /radar/ {
        return 302 /radar/;
    }

    location /finance-radar-api/ {
        proxy_pass http://127.0.0.1:18000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }
}
