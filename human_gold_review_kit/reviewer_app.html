<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Finance Radar 真人双盲金标</title>
  <style>
    :root{color-scheme:dark;--bg:#07101a;--panel:#0d1a29;--line:#2b4055;--text:#edf6ff;--muted:#9eb2c7;--cyan:#39d6ff;--green:#39dfa0;--amber:#ffc15c;--red:#ff7588}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#06101a,#081420 60%,#0a1927);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,select,textarea,input{font:inherit}
    .top{position:sticky;top:0;z-index:5;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:13px 20px;background:#07101af2;border-bottom:1px solid var(--line)}.brand{font-size:19px;font-weight:800}.pill{border:1px solid #2d7188;border-radius:999px;padding:3px 10px;color:#b8f0ff}.grow{flex:1}.progress{min-width:200px;color:var(--muted)}.bar{height:7px;background:#192b3c;border-radius:99px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green))}
    .wrap{max-width:1180px;margin:auto;padding:20px}.warning{border:1px solid #725c2e;background:#241e12;color:#ffdb9b;border-radius:12px;padding:14px 16px;margin-bottom:16px}.card,.attest{background:#0d1a29f2;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 15px 35px #0003}.head{display:flex;justify-content:space-between;gap:16px}.head h1{margin:3px 0;font-size:25px}.muted{color:var(--muted)}.summary{border-left:4px solid var(--cyan);background:#091723;border-radius:8px;padding:13px;margin:16px 0}.passages{display:grid;gap:12px}.passage{border:1px solid #2a4055;background:#081521;border-radius:12px;padding:14px}.passage .quote{white-space:pre-wrap;background:#050d15;border-radius:8px;padding:12px;margin-top:9px;color:#dceafa}.context{display:flex;gap:8px;flex-wrap:wrap;color:#a8c0d7;font-size:13px}
    .conflicts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.conflict{border:1px solid #7b5d28;background:#211a10;border-radius:11px;padding:12px}.conflict strong{color:var(--amber)}.axes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.field{background:#091724;border:1px solid #294158;border-radius:12px;padding:12px}label{display:block;color:var(--muted);font-size:14px;margin-bottom:5px}select,textarea{width:100%;background:#071420;border:1px solid #3b5770;color:var(--text);border-radius:9px;padding:10px 11px}textarea{min-height:115px;resize:vertical}.hint{font-size:13px;color:var(--muted);margin-top:5px}.attest label{display:flex;gap:9px;align-items:flex-start;color:#d9e7f5;margin:8px 0}.attest input{margin-top:5px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #3a5872;background:#102338;color:var(--text);padding:10px 17px;border-radius:10px;cursor:pointer}.btn.primary{background:#0f6988;border-color:#36c5ef}.btn.good{background:#126242;border-color:#3ada9c}.btn:disabled{opacity:.45;cursor:not-allowed}.error{display:none;color:#ffacb7;border:1px solid #713746;background:#2b121a;border-radius:9px;padding:10px;margin:12px 0}.ok{color:var(--green)}
    @media(max-width:760px){.top{position:static}.wrap{padding:12px}.axes,.conflicts{grid-template-columns:1fr}.head{display:block}.progress{width:100%}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">◇ Finance Radar 真人双盲金标</div>
    <span class="pill">__REVIEWER_SLOT__</span><span class="pill" id="rolePill"></span><div class="grow"></div>
    <div class="progress"><span id="progressText">0 / 0</span><div class="bar"><i id="progressBar"></i></div></div>
    <button class="btn" id="draftBtn">导出进度备份</button><button class="btn good" id="finalBtn">导出最终结果</button>
  </header>
  <main class="wrap">
    <div class="warning"><strong>硬性规则：</strong>本批次只允许真人独立判断。禁止使用 ChatGPT、Claude、Codex 等任何 AI；禁止查看股价、事后涨跌、旧状态、旧标签或模型输出；禁止询问另一名审核者。你只填三轴，程序稍后派生最终标签。</div>
    <section class="card" id="reviewCard"></section>
    <section class="attest">
      <strong>最终导出前逐项确认</strong>
      <label><input type="checkbox" data-att="human_only"> 本批次全部由我本人阅读和判断。</label>
      <label><input type="checkbox" data-att="independent_judgment"> 我独立判断，没有协商答案或冒充他人。</label>
      <label><input type="checkbox" data-att="no_ai_assistance"> 我没有使用任何生成式AI、AI搜索、AI摘要或AI分类。</label>
      <label><input type="checkbox" data-att="no_model_output"> 我没有查看风险路由模型的输出。</label>
      <label><input type="checkbox" data-att="no_market_outcome"> 我没有查看消息后的价格、收益或成交结果。</label>
      <label><input type="checkbox" data-att="no_old_label"> 我没有查找事件的旧状态、旧标签或已发布结论。</label>
    </section>
  </main>
  <script>
  "use strict";
  const assignment=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob("__ASSIGNMENT_BASE64__"),c=>c.charCodeAt(0))));
  const storageKey=`finance-radar-human-gold:${assignment.batch_id}:${assignment.reviewer_slot}:${assignment.assignment_sha256}`;
  const blank=()=>({materiality:"",polarity:"",evidence_state:"",rationale:"",reviewed_at:"",duration_seconds:0,started_at:new Date().toISOString()});
  let saved=JSON.parse(localStorage.getItem(storageKey)||"null")||{index:0,results:{},attestations:{}};
  assignment.events.forEach(item=>{if(!saved.results[item.sample_token])saved.results[item.sample_token]=blank();});
  const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const zh={MATERIAL_ADVERSE:"重大不利",NOT_MATERIAL_ADVERSE:"非重大不利",UNCLEAR:"不清楚",ADVERSE:"负面",POSITIVE:"正面",NEUTRAL:"中性",MIXED:"混合",PRIMARY_SUPPORTED:"一手证据支持",MULTI_SOURCE_SUPPORTED:"多独立来源支持",DISCOVERY_ONLY:"仅发现源/标题线索",CONFLICTED:"证据冲突",INSUFFICIENT:"证据不足"};
  function save(){localStorage.setItem(storageKey,JSON.stringify(saved));updateProgress();}
  function current(){return assignment.events[saved.index]}function result(){return saved.results[current().sample_token]}
  function options(values,selected){return '<option value="">请选择</option>'+values.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(zh[v]||v)}</option>`).join('')}
  function conflictHtml(item){if(!item.conflict_options)return '';return `<h2>两份独立意见（仅仲裁人可见）</h2><div class="conflicts">${item.conflict_options.map(x=>`<div class="conflict"><strong>意见${esc(x.option)}</strong><div>重大性：${esc(zh[x.materiality]||x.materiality)}</div><div>极性：${esc(zh[x.polarity]||x.polarity)}</div><div>证据：${esc(zh[x.evidence_state]||x.evidence_state)}</div><p>${esc(x.rationale)}</p></div>`).join('')}</div>`}
  function render(){const item=current(),c=item.content,r=result();const passages=(c.passages||[]).map((p,i)=>`<article class="passage"><div class="context"><strong>证据 ${i+1}</strong><span>${esc(p.authority_context||'权威级别不明')}</span><span>${esc(p.document_type||'文档类型不明')}</span><span>${esc(p.item_section||'')}</span><span>${esc(p.published_at||'时间不明')}</span></div><div class="quote">${esc(p.passage)}</div></article>`).join('');$("reviewCard").innerHTML=`<div class="head"><div><div class="muted">第 ${saved.index+1} / ${assignment.sample_count} 条 · 匿名编号 ${esc(item.sample_token)}</div><h1>${esc(c.headline||'未命名事件')}</h1><div class="muted">事件日期 ${esc(c.event_date||'不明')} · 截止时点 ${esc(c.as_of||'不明')}</div></div><span class="pill">不显示旧标签</span></div><div class="summary"><strong>证据上下文摘要</strong><p>${esc(c.summary||'请直接阅读原文证据。')}</p>${(c.context_facts||[]).map(x=>`<div>• ${esc(x)}</div>`).join('')}</div><h2>冻结证据</h2><div class="passages">${passages}</div>${conflictHtml(item)}<h2>独立填写三个轴</h2><div class="axes"><div class="field"><label>重大性：如果属实，是否足以显著影响旧普通股/偿付/持续经营/上市资格？</label><select id="materiality">${options(assignment.axes.materiality,r.materiality)}</select></div><div class="field"><label>极性：内容本身对目标主体是什么方向？</label><select id="polarity">${options(assignment.axes.polarity,r.polarity)}</select></div><div class="field"><label>证据状态：截至冻结时点，原文支持强度如何？</label><select id="evidenceState">${options(assignment.axes.evidence_state,r.evidence_state)}</select></div></div><label>理由（至少20字，必须引用具体原文事实，不能只写“我认为”）</label><textarea id="rationale" placeholder="例如：法院文件明确写明公司已提交破产申请，属于已经发生的重大不利事件；证据是一手法院材料。">${esc(r.rationale)}</textarea><div class="hint">不填写“RISK_REVIEW / NON_TARGET / ABSTAIN”，程序会在双审一致或第三人仲裁后派生。</div><div class="error" id="errorBox"></div><div class="actions"><button class="btn" id="prevBtn" ${saved.index===0?'disabled':''}>← 上一条</button><button class="btn primary" id="nextBtn">保存并下一条 →</button><span class="muted">页面自动保存在本机浏览器。</span></div>`;
    $("materiality").addEventListener('change',()=>{r.materiality=$("materiality").value;save()});$("polarity").addEventListener('change',()=>{r.polarity=$("polarity").value;save()});$("evidenceState").addEventListener('change',()=>{r.evidence_state=$("evidenceState").value;save()});$("rationale").addEventListener('input',()=>{r.rationale=$("rationale").value;save()});$("prevBtn").addEventListener('click',()=>{saved.index=Math.max(0,saved.index-1);save();render();scrollTo(0,0)});$("nextBtn").addEventListener('click',()=>{const errors=validateResult(r);if(errors.length){const box=$("errorBox");box.textContent=errors.join('；');box.style.display='block';return}finishTiming(r);saved.index=Math.min(assignment.events.length-1,saved.index+1);save();render();scrollTo(0,0)});updateProgress();}
  function validateResult(r){const errors=[];if(!r.materiality)errors.push('请选择重大性');if(!r.polarity)errors.push('请选择极性');if(!r.evidence_state)errors.push('请选择证据状态');if((r.rationale||'').trim().length<20)errors.push('理由至少20字');return errors}
  function finishTiming(r){if(!r.reviewed_at)r.reviewed_at=new Date().toISOString();const start=Date.parse(r.started_at||r.reviewed_at);r.duration_seconds=Math.max(0,Math.round((Date.now()-start)/1000))}
  function completed(){return assignment.events.filter(item=>validateResult(saved.results[item.sample_token]).length===0).length}
  function attestComplete(){return ['human_only','independent_judgment','no_ai_assistance','no_model_output','no_market_outcome','no_old_label'].every(k=>saved.attestations[k]===true)}
  function updateProgress(){const done=completed();$("progressText").textContent=`${done} / ${assignment.sample_count}`;$("progressBar").style.width=`${100*done/assignment.sample_count}%`;$("finalBtn").disabled=done!==assignment.sample_count||!attestComplete()}
  function submission(final){if(final)assignment.events.forEach(item=>finishTiming(saved.results[item.sample_token]));return {schema_version:1,contract_version:assignment.contract_version,batch_id:assignment.batch_id,reviewer_slot:assignment.reviewer_slot,review_role:assignment.review_role,reviewer_token:assignment.reviewer_token,assignment_sha256:assignment.assignment_sha256,attestations:{human_only:!!saved.attestations.human_only,independent_judgment:!!saved.attestations.independent_judgment,no_ai_assistance:!!saved.attestations.no_ai_assistance,no_model_output:!!saved.attestations.no_model_output,no_market_outcome:!!saved.attestations.no_market_outcome,no_old_label:!!saved.attestations.no_old_label},peer_answers_hidden:assignment.review_role==='REVIEWER',exported_at:new Date().toISOString(),complete:final,results:assignment.events.map(item=>{const r=saved.results[item.sample_token];return {sample_token:item.sample_token,materiality:r.materiality,polarity:r.polarity,evidence_state:r.evidence_state,rationale:r.rationale.trim(),reviewed_at:r.reviewed_at||new Date().toISOString(),duration_seconds:r.duration_seconds||0}}),target_label_submitted:false,canonical_state_changed:false,no_trading:true}}
  function download(final){save();if(final&&$("finalBtn").disabled){alert('请先完成全部条目，并勾选六项真人独立审核声明。');return}const payload=submission(final),blob=new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${assignment.batch_id}_${assignment.reviewer_slot}${final?'.gold-review.json':'.draft.json'}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  $("rolePill").textContent=assignment.review_role==='ARBITER'?'第三人仲裁':'独立审核员';document.querySelectorAll('[data-att]').forEach(el=>{el.checked=!!saved.attestations[el.dataset.att];el.addEventListener('change',()=>{saved.attestations[el.dataset.att]=el.checked;save()})});$("draftBtn").addEventListener('click',()=>download(false));$("finalBtn").addEventListener('click',()=>download(true));render();
  </script>
</body>
</html>
