server {
    listen __FINANCE_RADAR_PORT__ ssl;
    listen [::]:__FINANCE_RADAR_PORT__ ssl;
    http2 on;
    server_name __FINANCE_RADAR_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__FINANCE_RADAR_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FINANCE_RADAR_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FinanceRadarTLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # The public interface is already authored in Chinese. Declaring the
    # response language prevents browser auto-translation from rewriting
    # product copy such as "只读研究" into unrelated wording.
    add_header Content-Language "zh-CN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;

    location = / {
        return 302 /radar/;
    }

    location = /radar {
        return 301 /radar/;
    }

    # A small non-sensitive release fingerprint lets the installer and an
    # external observer distinguish this Streamlit surface from the retired
    # static terminal.  It deliberately exposes no build paths, credentials or
    # application state.
    location = /radar/release.json {
        alias /var/www/finance-radar-terminal/release.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /radar/offhost-status.json {
        return 404;
    }

    # Internal review, operations and adjudication pages never cross the
    # public reverse proxy. The second guard closes Home's query bootstrap too.
    location ~ ^/radar/(Event_Intelligence|Operations_and_Model|Adjudication_Studio)(?:/|$) {
        return 404;
    }

    # A fresh Streamlit 1.59 multipage deep link resolves _stcore relative to
    # the page slug. Only the two public secondary pages may bootstrap through
    # Home, which restores the original query string in-session.
    location ~ ^/radar/(Replay_Lab|Method_and_Boundaries)/?$ {
        return 302 /radar/?_page=$1&$args;
    }

    # Streamlit 1.59 resolves its _stcore endpoints relative to a multipage
    # route. Canonicalize every endpoint, including the WebSocket stream, to
    # the configured baseUrlPath so public nested pages remain interactive.
    location ~ ^/radar/(Replay_Lab|Method_and_Boundaries)/_stcore/(.*)$ {
        rewrite ^/radar/[^/]+/_stcore/(.*)$ /radar/_stcore/$1 break;
        proxy_pass http://127.0.0.1:18501;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location /radar/ {
        if ($arg__page ~ ^(Event_Intelligence|Operations_and_Model|Adjudication_Studio)$) {
            return 404;
        }
        proxy_pass http://127.0.0.1:18501;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # FastAPI, its schema and documentation are loopback-only. Public
    # Streamlit reads it server-side through 127.0.0.1:18000.
    location = /finance-radar-api {
        return 404;
    }

    location ^~ /finance-radar-api/ {
        return 404;
    }

    # The administration service listens on 127.0.0.1:18502 and is reachable
    # only through an operator-created SSH tunnel, never through Nginx.
    location = /radar-admin {
        return 404;
    }

    location ^~ /radar-admin/ {
        return 404;
    }

    location = /radar-review {
        return 404;
    }

    location ^~ /radar-review/ {
        return 404;
    }

    location = /radar-ops {
        return 404;
    }

    location ^~ /radar-ops/ {
        return 404;
    }
}
