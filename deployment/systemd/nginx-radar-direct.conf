server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name radar.167-172-69-16.sslip.io;

    ssl_certificate /etc/letsencrypt/live/radar.167-172-69-16.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radar.167-172-69-16.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FinanceRadarTLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        return 302 /radar/;
    }

    location = /radar {
        return 301 /radar/;
    }

    # A fresh Streamlit 1.59 multipage deep link resolves _stcore relative to
    # the page slug. Bootstrap through Home, which switches pages in-session
    # and restores the original query string without a broken WebSocket path.
    location ~ ^/radar/(Event_Intelligence|Replay_Lab|Operations_and_Model|Adjudication_Studio)/?$ {
        return 302 /radar/?_page=$1&$args;
    }

    # Streamlit 1.59 resolves its _stcore endpoints relative to a multipage
    # route. Canonicalize every endpoint, including the WebSocket stream, to
    # the configured baseUrlPath so nested pages remain fully interactive.
    location ~ ^/radar/(Event_Intelligence|Replay_Lab|Operations_and_Model|Adjudication_Studio)/_stcore/(.*)$ {
        rewrite ^/radar/[^/]+/_stcore/(.*)$ /radar/_stcore/$1 break;
        proxy_pass http://127.0.0.1:18501;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location /radar/ {
        proxy_pass http://127.0.0.1:18501;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location /finance-radar-api/ {
        proxy_pass http://127.0.0.1:18000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }
}
