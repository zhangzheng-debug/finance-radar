    location = /radar {
        return 301 /radar/;
    }

    # Bootstrap fresh multipage deep links through Home. Home then performs an
    # in-session page switch and restores the original query string.
    location ~ ^/radar/(Event_Intelligence|Replay_Lab|Operations_and_Model|Adjudication_Studio)/?$ {
        return 302 /radar/?_page=$1&$args;
    }

    # Canonicalize all Streamlit multipage _stcore traffic, including the
    # WebSocket stream, to the configured baseUrlPath.
    location ~ ^/radar/(Event_Intelligence|Replay_Lab|Operations_and_Model|Adjudication_Studio)/_stcore/(.*)$ {
        rewrite ^/radar/[^/]+/_stcore/(.*)$ /radar/_stcore/$1 break;
        proxy_pass http://127.0.0.1:18501;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location /radar/ {
        proxy_pass http://127.0.0.1:18501;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location /finance-radar-api/ {
        proxy_pass http://127.0.0.1:18000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }
