    location = /radar {
        return 301 /radar/;
    }

    location = /radar/offhost-status.json {
        return 404;
    }

    # Internal pages are available only from the manual loopback admin service.
    location ~ ^/radar/(Event_Intelligence|Operations_and_Model|Adjudication_Studio)(?:/|$) {
        return 404;
    }

    # Bootstrap only public multipage deep links through Home.
    location ~ ^/radar/(Replay_Lab|Method_and_Boundaries)/?$ {
        return 302 /radar/?_page=$1&$args;
    }

    # Canonicalize all Streamlit multipage _stcore traffic, including the
    # WebSocket stream, to the configured baseUrlPath.
    location ~ ^/radar/(Replay_Lab|Method_and_Boundaries)/_stcore/(.*)$ {
        rewrite ^/radar/[^/]+/_stcore/(.*)$ /radar/_stcore/$1 break;
        proxy_pass http://127.0.0.1:18501;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location /radar/ {
        if ($arg__page ~ ^(Event_Intelligence|Operations_and_Model|Adjudication_Studio)$) {
            return 404;
        }
        proxy_pass http://127.0.0.1:18501;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location = /finance-radar-api {
        return 404;
    }

    location ^~ /finance-radar-api/ {
        return 404;
    }

    # There is intentionally no public proxy to the loopback admin service.
    location = /radar-admin {
        return 404;
    }

    location ^~ /radar-admin/ {
        return 404;
    }

    location = /radar-review {
        return 404;
    }

    location ^~ /radar-review/ {
        return 404;
    }

    location = /radar-ops {
        return 404;
    }

    location ^~ /radar-ops/ {
        return 404;
    }
