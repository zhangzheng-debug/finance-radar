    location = /radar {
        return 301 /radar/;
    }

    location = /radar/offhost-status.json {
        return 404;
    }

    # Internal pages are available only from the manual loopback admin service.
    location ~ ^/radar/(Event_Intelligence|Operations_and_Model|Adjudication_Studio)(?:/|$) {
        return 404;
    }

    # Bootstrap only public multipage deep links through Home.
    location ~ ^/radar/(Replay_Lab|Method_and_Boundaries)/?$ {
        return 302 /radar/?_page=$1&$args;
    }

    # Canonicalize all Streamlit multipage _stcore traffic, including the
    # WebSocket stream, to the configured baseUrlPath.
    location ~ ^/radar/(Replay_Lab|Method_and_Boundaries)/_stcore/(.*)$ {
        rewrite ^/radar/[^/]+/_stcore/(.*)$ /radar/_stcore/$1 break;
        proxy_pass http://127.0.0.1:18501;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location /radar/ {
        if ($arg__page ~ ^(Event_Intelligence|Operations_and_Model|Adjudication_Studio)$) {
            return 404;
        }
        proxy_pass http://127.0.0.1:18501;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location = /finance-radar-api {
        if ($request_method !~ ^(GET|HEAD)$) { return 403; }
        return 308 /finance-radar-api/;
    }

    location = /finance-radar-api/ {
        root /var/www;
        try_files /finance-radar-public-api/index.html =404;
        default_type text/html;
        limit_except GET { deny all; }
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ~ ^/finance-radar-api/api/v1/(?:live|overview|events|events/facets|events/[-A-Za-z0-9_.:]+(?:/(?:dossier|knowledge|evidence|sources|source-interpretations|capture-explanation))?)$ {
        limit_except GET { deny all; }
        rewrite ^/finance-radar-api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Admin-Token "";
        proxy_set_header X-Reviewer-Token "";
        proxy_set_header X-Operator-Token "";
        proxy_set_header X-API-Key "";
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 20s;
        proxy_buffering on;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /finance-radar-api/ {
        return 404;
    }

    # There is intentionally no public proxy to the loopback admin service.
    location = /radar-admin {
        return 404;
    }

    location ^~ /radar-admin/ {
        return 404;
    }

    location = /radar-review {
        return 404;
    }

    location ^~ /radar-review/ {
        return 404;
    }

    location = /radar-ops {
        return 404;
    }

    location ^~ /radar-ops/ {
        return 404;
    }
