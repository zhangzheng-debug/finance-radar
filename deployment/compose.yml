name: finance-radar

x-radar-environment: &radar-environment
  FINANCE_RADAR_DB: /app/data/finance_radar.sqlite3
  FINANCE_RADAR_OPS_DB: /app/data/finance_radar_operations.sqlite3
  FINANCE_RADAR_ARTIFACT_DIR: /app/artifacts
  FINANCE_RADAR_REPLAY_DIR: /app/replay/cases
  FINANCE_RADAR_API_URL: http://api:8000
  FINANCE_RADAR_WEB_URL: ${FINANCE_RADAR_PUBLIC_URL:-http://localhost}
  FINANCE_RADAR_DEMO_MODE: ${FINANCE_RADAR_DEMO_MODE:-RECENT_CAPTURE}
  FINANCE_RADAR_ADMIN_TOKEN: ${FINANCE_RADAR_ADMIN_TOKEN:-change-me-before-public-deploy}
  FINANCE_RADAR_REVIEWER_TOKEN: ${FINANCE_RADAR_REVIEWER_TOKEN:-change-me-reviewer}
  FINANCE_RADAR_OPERATOR_TOKEN: ${FINANCE_RADAR_OPERATOR_TOKEN:-change-me-operator}

x-radar-public-web-environment: &radar-public-web-environment
  FINANCE_RADAR_API_URL: http://api:8000
  FINANCE_RADAR_UI_ROLE: public
  FINANCE_RADAR_SHOW_DEBUG: "0"

x-radar-service: &radar-service
  build:
    context: ..
    dockerfile: deployment/Dockerfile
  image: finance-radar:${FINANCE_RADAR_RELEASE_ID:-local}
  labels:
    org.opencontainers.image.title: Finance Radar
    org.opencontainers.image.version: ${FINANCE_RADAR_RELEASE_ID:-local}
    org.opencontainers.image.revision: ${FINANCE_RADAR_GIT_COMMIT:-unknown}
    finance-radar.release-id: ${FINANCE_RADAR_RELEASE_ID:-local}
  restart: unless-stopped
  env_file:
    - ../.env
  environment: *radar-environment
  volumes:
    - ../data:/app/data
    - ../artifacts:/app/artifacts
    - ../reports:/app/reports
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *radar-service
    command: ["python", "-m", "uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s

  web:
    <<: *radar-service
    # Do not inherit .env: it can contain provider credentials and the admin
    # token. The public UI needs only a loopback/container API URL and its role.
    env_file: []
    environment: *radar-public-web-environment
    volumes: []
    command: ["python", "-m", "streamlit", "run", "app/web/Home.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    expose: ["8501"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s

  admin:
    <<: *radar-service
    profiles: ["admin"]
    environment:
      <<: *radar-environment
      FINANCE_RADAR_UI_ROLE: admin
      FINANCE_RADAR_SHOW_DEBUG: "0"
    command: ["python", "-m", "streamlit", "run", "app/web/Admin.py", "--server.address", "0.0.0.0", "--server.port", "8502", "--server.baseUrlPath", "radar-admin", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    ports: ["127.0.0.1:18502:8502"]
    depends_on:
      api:
        condition: service_healthy

  reviewer:
    <<: *radar-service
    profiles: ["reviewer"]
    env_file: []
    environment:
      FINANCE_RADAR_API_URL: http://api:8000
      FINANCE_RADAR_UI_ROLE: reviewer
      FINANCE_RADAR_REVIEWER_TOKEN: ${FINANCE_RADAR_REVIEWER_TOKEN:?set a reviewer token}
      FINANCE_RADAR_SHOW_DEBUG: "0"
    volumes: []
    command: ["python", "-m", "streamlit", "run", "app/web/Reviewer.py", "--server.address", "0.0.0.0", "--server.port", "8503", "--server.baseUrlPath", "radar-review", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    ports: ["127.0.0.1:18503:8503"]
    depends_on:
      api:
        condition: service_healthy

  operator:
    <<: *radar-service
    profiles: ["operator"]
    env_file: []
    environment:
      FINANCE_RADAR_API_URL: http://api:8000
      FINANCE_RADAR_UI_ROLE: operator
      FINANCE_RADAR_OPERATOR_TOKEN: ${FINANCE_RADAR_OPERATOR_TOKEN:?set an operator token}
      FINANCE_RADAR_SHOW_DEBUG: "0"
    volumes: []
    command: ["python", "-m", "streamlit", "run", "app/web/Operator.py", "--server.address", "0.0.0.0", "--server.port", "8504", "--server.baseUrlPath", "radar-ops", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    ports: ["127.0.0.1:18504:8504"]
    depends_on:
      api:
        condition: service_healthy

  worker:
    <<: *radar-service
    # The continuous collector must not autonomously apply formal
    # verification; scoped manual batches remain the only mutation path.
    command: ["python", "-m", "app.workers.continuous", "--interval", "300", "--no-light-verify"]
    depends_on:
      api:
        condition: service_healthy

  backup:
    <<: *radar-service
    # User-selected retention: keep only the last daily bundle after its
    # restore verification succeeds; no weekly copies are retained.
    command: ["python", "-m", "app.workers.backup_scheduler", "--interval", "86400", "--retention", "1", "--weekly-retention", "0"]
    depends_on:
      api:
        condition: service_healthy

  notifier:
    <<: *radar-service
    profiles: ["notifications"]
    command: ["python", "-m", "app.workers.notifier", "--send", "--interval", "60"]
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FINANCE_RADAR_DOMAIN: ${FINANCE_RADAR_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
